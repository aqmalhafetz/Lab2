<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"] {
            display: block;
            margin-top: 2px;
        }
        textarea {
            display: block;
            width: 400px;
            height: 80px;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <h2>Conference Registration Form</h2>

    <form action="#" method="post">
        
        <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
        </div>

        <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email addres" required>
        </div>

        <div class="form-group">
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" value="18" min="18" max="99" required>
        </div>

        <div class="form-group">
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male" style="font-weight: normal;">Male</label><br>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female" style="font-weight: normal;">Female</label>
        </div>

        <div class="form-group">
            <label for="country">Country of Residence:</label><br>
            <select id="country" name="country">
                <option value="Malaysia" selected>Malaysia</option>
                <option value="Singapore">Singapore</option>
                <option value="Indonesia">Indonesia</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <div class="form-group">
            <label>Areas of Interest:</label><br>
            <input type="checkbox" id="sd" name="interest" value="Software Development">
            <label for="sd" style="font-weight: normal;">Software Development</label><br>
            <input type="checkbox" id="ds" name="interest" value="Data Science">
            <label for="ds" style="font-weight: normal;">Data Science</label><br>
            <input type="checkbox" id="cs" name="interest" value="Cybersecurity">
            <label for="cs" style="font-weight: normal;">Cybersecurity</label><br>
            <input type="checkbox" id="ai" name="interest" value="Artificial Intelligence">
            <label for="ai" style="font-weight: normal;">Artificial Intelligence</label>
        </div>

        <div class="form-group">
            <label>Experience Level:</label><br>
            <input type="radio" id="beginner" name="experience" value="Beginner">
            <label for="beginner" style="font-weight: normal;">Beginner</label><br>
            <input type="radio" id="intermediate" name="experience" value="Intermediate">
            <label for="intermediate" style="font-weight: normal;">Intermediate</label><br>
            <input type="radio" id="advanced" name="experience" value="Advanced">
            <label for="advanced" style="font-weight: normal;">Advanced</label>
        </div>

        <div class="form-group">
            <label for="comments">Comments or Questions:</label>
            <textarea id="comments" name="comments" placeholder="Any comments or questions?"></textarea>
        </div>

        <div>
            <button type="submit">Register</button>
            <button type="reset">Reset</button>
        </div>

    </form>

</body>
</html>
